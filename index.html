<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HMA Digital - EV 3D Configurator</title>
    
    <!-- Google Fonts: Playfair Display (Title) & Caveat (Handwriting) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Mobile-optimized reset */
        body {
            overscroll-behavior-y: none;
            background-color: #fcfcfc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
        }

        .font-playfair { font-family: "Playfair Display", serif; }
        .font-caveat { font-family: "Caveat", cursive; }

        /* Fullscreen immersive 3D viewer */
        model-viewer {
            width: 100vw;
            height: 100vh;
            background-color: transparent;
            --poster-color: transparent;
            outline: none;
            /* 确保模型在控制面板之上，但不阻挡点击 */
            position: relative;
            z-index: 1;
        }
        model-viewer::part(default-progress-bar) { display: none; }

        /* Top Header Overlay */
        .header-overlay {
            position: absolute;
            top: 6vh;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none; 
        }

        /* Combined Bottom Dock (Glassmorphism) */
        .bottom-dock {
            position: absolute;
            bottom: 4vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            z-index: 20;
            /* 防止面板本身被拖拽 */
            user-select: none;
        }

        /* Color Buttons Container */
        .color-palette {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* Minimalist Color Buttons */
        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }
        
        .color-btn::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: border-color 0.3s ease;
        }

        .color-btn:active { transform: scale(0.9); }
        .color-btn.active { transform: scale(1.15); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .color-btn.active::after { border-color: currentColor; }

        /* --- 七彩水晶球按钮样式 (缩小版) --- */
        .crystal-ball-btn {
            width: 40px; /* 调整尺寸以适应面板 */
            height: 40px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
            box-shadow: 
                inset -6px -6px 12px rgba(0,0,0,0.4), 
                inset 6px 6px 12px rgba(255,255,255,0.9), 
                0 0 10px rgba(255, 255, 255, 0.6);
            border: none;
            cursor: pointer;
            animation: crystal-spin 4s linear infinite, crystal-pulse 1.5s ease-in-out infinite alternate;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .crystal-ball-btn::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 8px;
            width: 12px;
            height: 8px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: rotate(-45deg);
            z-index: 2;
        }

        .crystal-ball-btn::after {
            content: '✨';
            position: absolute;
            font-size: 16px;
            z-index: 1;
            animation: sparkle-blink 1s infinite alternate;
        }

        .crystal-ball-btn:active {
            transform: scale(0.9);
        }

        @keyframes crystal-spin {
            100% { filter: hue-rotate(360deg); }
        }
        @keyframes crystal-pulse {
            0% { transform: scale(1); box-shadow: inset -6px -6px 12px rgba(0,0,0,0.4), inset 6px 6px 12px rgba(255,255,255,0.9), 0 0 5px rgba(255,255,255,0.5); }
            100% { transform: scale(1.1); box-shadow: inset -6px -6px 12px rgba(0,0,0,0.4), inset 6px 6px 12px rgba(255,255,255,0.9), 0 0 15px rgba(255,255,255,1), 0 0 20px rgba(0,255,255,0.5); }
        }
        @keyframes sparkle-blink {
            0% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Handwriting Container */
        .action-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 8px;
            border-top: 1px solid rgba(0,0,0,0.05);
            width: 100%;
            justify-content: center;
        }

    </style>
</head>
<body>

    <!-- Floating Header -->
    <div class="header-overlay">
        <h1 class="font-playfair text-4xl tracking-tight text-gray-900 mb-1">Ev Scooter</h1>
        <p class="font-caveat text-2xl text-gray-500 tracking-wide">Let's dress it up.</p>
    </div>

    <!-- 3D Model -->
    <model-viewer
        id="bike-model"
        src="ev-scooter.glb"
        camera-controls
        auto-rotate
        rotation-per-second="10deg"
        shadow-intensity="1"
        shadow-softness="1.5"
        exposure="1.1"
        environment-image="neutral"
        camera-orbit="-45deg 80deg 2.5m"
        min-camera-orbit="auto auto 1.5m"
        max-camera-orbit="auto auto 4m">
        
        <!-- Elegant Loading State -->
        <div id="loading-prompt" slot="poster" class="absolute inset-0 flex flex-col items-center justify-center bg-[#fcfcfc] z-50 transition-opacity duration-700">
            <svg class="animate-spin h-8 w-8 text-gray-300 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="#333" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="font-caveat text-xl text-gray-400 tracking-widest">Waking up...</span>
        </div>
    </model-viewer>

    <!-- Combined Bottom Dock -->
    <div class="bottom-dock">
        <!-- Color Palette -->
        <div class="color-palette">
            <button class="color-btn active" style="background-color: #f5f5f7; color: #1d1d1f;" data-color="#ffffff" title="Pure"></button>
            <button class="color-btn" style="background-color: #2c2c2e; color: #2c2c2e;" data-color="#1f2937" title="Midnight"></button>
            <button class="color-btn" style="background-color: #e3ccaa; color: #e3ccaa;" data-color="#e3ccaa" title="Starlight"></button>
            <button class="color-btn" style="background-color: #98b3c6; color: #98b3c6;" data-color="#98b3c6" title="Pacific Blue"></button>
            <button class="color-btn" style="background-color: #bf3f3f; color: #bf3f3f;" data-color="#bf3f3f" title="Product Red"></button>
            
            <!-- Custom Color Picker Hidden as a Rainbow Button -->
            <div class="relative overflow-hidden rounded-full w-[30px] h-[30px] border border-gray-200 cursor-pointer shadow-sm transition-transform active:scale-90" style="background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);">
                <input type="color" id="custom-color-picker" class="absolute top-[-5px] left-[-5px] w-10 h-10 opacity-0 cursor-pointer" value="#ef4444">
            </div>
        </div>

        <!-- Action Area (Text + Crystal Ball) -->
        <div class="action-container">
            <div id="download-text" class="font-caveat text-xl text-gray-700 tracking-wide">
                Get me if you like me!
            </div>
            <button class="crystal-ball-btn" id="download-btn" title="Download Image"></button>
        </div>
    </div>

    <!-- Fallback UI for Local Testing -->
    <div id="error-message" class="absolute inset-0 flex flex-col items-center justify-center bg-[#fcfcfc] z-50 hidden">
        <p class="font-caveat text-3xl text-gray-800 tracking-widest mb-2">Oops!</p>
        <p class="text-sm text-gray-500 font-sans px-8 text-center mb-6">Local preview detected.<br>Please select the 3D model manually to bypass browser restrictions.</p>
        
        <label class="px-6 py-3 bg-gray-900 text-white rounded-full text-sm font-medium cursor-pointer hover:bg-gray-800 transition shadow-lg">
            Select ev-scooter.glb
            <input type="file" id="fallback-upload" accept=".glb" class="hidden">
        </label>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modelViewer = document.querySelector('#bike-model');
            const colorButtons = document.querySelectorAll('.color-btn');
            const customColorPicker = document.querySelector('#custom-color-picker');
            const fallbackUpload = document.querySelector('#fallback-upload');
            const downloadBtn = document.querySelector('#download-btn');
            const downloadText = document.querySelector('#download-text');
            
            let currentColor = '#ffffff'; 

            modelViewer.addEventListener('load', () => {
                const loader = document.getElementById('loading-prompt');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 700);
                applyColorToModel(currentColor);
            });

            modelViewer.addEventListener('error', () => {
                document.getElementById('loading-prompt').style.display = 'none';
                document.getElementById('error-message').classList.remove('hidden');
                document.getElementById('error-message').style.display = 'flex';
            });

            fallbackUpload.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    modelViewer.src = URL.createObjectURL(file);
                    document.getElementById('error-message').style.display = 'none';
                    const loader = document.getElementById('loading-prompt');
                    loader.style.display = 'flex';
                    loader.style.opacity = '1';
                    loader.querySelector('span').innerText = 'Loading local model...';
                }
            });

            function applyColorToModel(hexColor) {
                if (!modelViewer.model || !modelViewer.model.materials) return;
                const targetMaterial = modelViewer.model.materials[0]; 
                if (targetMaterial) {
                    targetMaterial.pbrMetallicRoughness.setBaseColorFactor(hexColor);
                }
            }

            colorButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    colorButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentColor = e.target.getAttribute('data-color');
                    applyColorToModel(currentColor);
                });
            });

            customColorPicker.addEventListener('input', (e) => {
                colorButtons.forEach(b => b.classList.remove('active'));
                currentColor = e.target.value;
                applyColorToModel(currentColor);
            });

            downloadBtn.addEventListener('click', async () => {
                try {
                    const originalText = downloadText.innerText;
                    downloadText.innerText = 'Catching...';
                    
                    const blob = await modelViewer.toBlob({idealAspect: true});
                    const url = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'My_EV_Scooter.png';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    setTimeout(() => {
                        URL.revokeObjectURL(url);
                        downloadText.innerText = originalText;
                    }, 1500);
                    
                } catch (error) {
                    console.error("Download failed:", error);
                    downloadText.innerText = 'Oops, try again!';
                    setTimeout(() => downloadText.innerText = 'Get me if you like me!', 2000);
                }
            });
        });
    </script>
</body>
</html>
